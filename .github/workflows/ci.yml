name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '9.8.2'

jobs:
  core-test:
    name: Core Module Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle
      
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      
      - name: Run core tests
        run: ./gradlew :core:test --info
      
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-reports
          path: core/build/reports/tests/
          retention-days: 7
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-results
          path: core/build/test-results/
          retention-days: 7

  app-lint:
    name: App Module Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle
      
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      
      - name: Run app lint
        run: ./gradlew :app:lint --info
      
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-lint-reports
          path: app/build/reports/lint/
          retention-days: 7

  diagnostic:
    name: Diagnostic Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle
      
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      
      - name: Run diagnostic (gradlew help)
        run: ./gradlew help
      
      - name: Verify project structure
        run: ./gradlew projects

  # Live smoke test - only runs on manual trigger or schedule
  live-smoke-test:
    name: Live Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    env:
      RUN_LIVE_TESTS: 'true'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle
      
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      
      - name: Run live smoke test
        run: ./gradlew :core:test --tests "com.atlas.ultra.core.LiveSmokeTest" --info
      
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-smoke-test-reports
          path: core/build/reports/tests/
          retention-days: 7